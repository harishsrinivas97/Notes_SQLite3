
{% extends "base.html" %}

{% block title %}Edit Note{% endblock %}

{% block content %}

<div class="form-page-container">
    <div class="form-card">
        <h2 class="form-card-title">Edit Note</h2>

        <form method="POST"
              action="{{ url_for('Editnote', nid=note['nid']) }}" class="note-form">

            <div class="form-group">
                <label for="titel" class="form-label">Note Title</label>
                <input type="text"
                       id="titel"
                       name="titel"
                       value="{{ note['titel'] }}"
                       maxlength="100"
                       required class="form-input">
            </div>

            <div class="form-group">
                <label for="content" class="form-label">Note Content</label>
                <textarea id="content"
                          name="content"
                          rows="10"
                          required class="form-textarea">{{ note['content'] }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Note</button>
                <a href="{{ url_for('Dashboard') }}" class="btn btn-outline">Cancel</a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
