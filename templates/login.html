{% extends "base.html" %}

{% block title %}Login - Notes Management System{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to access your personal notes.</p>
        </div>

        <form action="/verify" method="POST" class="auth-form">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username" required
                       autocomplete="username" class="form-input">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required
                       autocomplete="current-password" class="form-input">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>

        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register" class="auth-link">Sign Up</a></p>
            <p><a href="/forgot_password" class="auth-link">Forgot Password?</a></p>
        </div>
    </div>
</div>

{% endblock %}
