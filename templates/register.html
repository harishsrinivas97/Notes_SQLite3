{% extends "base.html" %}

{% block title %}Create Account - Notes Management System{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Register to manage your personal notes.</p>
        </div>

        <form action="/register" method="POST" id="registerForm" class="auth-form">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username"
                       placeholder="Enter your username" required class="form-input">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email"
                       placeholder="Enter your email" required autocomplete="email" class="form-input">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password"
                       placeholder="Create a password" required minlength="8"
                       autocomplete="new-password" class="form-input">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password"
                       placeholder="Confirm your password" required minlength="8"
                       autocomplete="new-password" class="form-input">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>

        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login" class="auth-link">Sign In</a></p>
        </div>
    </div>
</div>

<script>
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm_password");

    function validatePasswordMatch() {
        if (
            confirmPasswordInput.value &&
            passwordInput.value !== confirmPasswordInput.value
        ) {
            confirmPasswordInput.setCustomValidity("Passwords do not match");
        } else {
            confirmPasswordInput.setCustomValidity("");
        }
    }

    passwordInput.addEventListener("input", validatePasswordMatch);
    confirmPasswordInput.addEventListener("input", validatePasswordMatch);
</script>

{% endblock %}
