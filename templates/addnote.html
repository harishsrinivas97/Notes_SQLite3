
{% extends 'base.html' %}

{% block title %}Add Note{% endblock %}

{% block content %}

<div class="form-page-container">
    <div class="form-card">
        <h2 class="form-card-title">Add a New Note</h2>

        <form action="{{ url_for('Addnote') }}" method="POST" class="note-form">
            <div class="form-group">
                <label for="titel" class="form-label">Note Title</label>
                <input type="text" id="titel" name="titel"
                       maxlength="100" required class="form-input"
                       placeholder="Enter note title">
            </div>

            <div class="form-group">
                <label for="content" class="form-label">Note Content</label>
                <textarea id="content" name="content"
                          rows="10" required class="form-textarea"
                          placeholder="Write your note here..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Note</button>
                <a href="{{ url_for('Dashboard') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
