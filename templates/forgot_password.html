{% extends "base.html" %}

{% block title %}Forgot Password - Notes Management System{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Forgot Password</h2>
            <p class="auth-subtitle">Enter your registered email to reset your password.</p>
        </div>

        <form action="/send_reset_link" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Registered Email</label>
                <input type="email" id="email" name="email" required
                       class="form-input" placeholder="Enter your email">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p>Remember your password? <a href="/login" class="auth-link">Sign In</a></p>
        </div>
    </div>
</div>

{% endblock %}
